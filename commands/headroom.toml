description = "Run a headroom command (status, savings, memory, dashboard, proxy, update)"
prompt = "Execute the headroom CLI command with args: `headroom {{args}}`. You MUST strictly validate the input: {{args}} must only contain alphanumeric characters, spaces, and hyphens. You are STRICTLY PROHIBITED from executing the command if it contains shell metacharacters (e.g. `;`, `&&`, `|`, `$`, `>`, `<`, `` ` ``). Valid options are: doctor, savings, memory list, memory stats, dashboard, proxy, update."
